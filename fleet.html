<script>
(()=>{'use strict';
const B=JSON.parse(document.getElementById('fleet-encrypted').textContent),enc=new TextEncoder(),dec=new TextDecoder();
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const aad=purpose=>enc.encode('hermes-fleet:'+purpose+':v1');
async function decrypt(blob,key,purpose){
 if(blob.v!==1||blob.alg!=='AES-256-GCM'||blob.zip!=='gzip'||blob.iter!==B.iter||blob.salt!==B.salt||blob.purpose!==purpose)throw new Error('Unsupported encrypted envelope');
 const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(blob.iv),additionalData:aad(purpose)},key,bytes(blob.ct));
 const text=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 if(text.length>8000000)throw new Error('Snapshot exceeds limit');return text;
}
document.getElementById('unlock-form').addEventListener('submit',async e=>{
 e.preventDefault();const button=document.getElementById('unlock-button'),error=document.getElementById('err');button.disabled=true;error.textContent='Unlocking…';
 try{
  if(!globalThis.crypto?.subtle)throw new Error('secure-context');
  const field=document.getElementById('pw');const material=await crypto.subtle.importKey('raw',enc.encode(field.value),'PBKDF2',false,['deriveKey']);field.value='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(B.salt),iterations:B.iter,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=await decrypt(B,key,'page');
  const feedURL=new URL('fleet-data.enc.json',location.href);let locked=false;
  window.fleetRefresh=async()=>{
   if(locked)throw new Error('Locked');
   const url=new URL(feedURL);url.searchParams.set('v',Date.now());
   const response=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
   if(!response.ok)throw new Error('Snapshot unavailable');
   const body=await response.text();if(body.length>8000000)throw new Error('Snapshot exceeds limit');
   const value=JSON.parse(await decrypt(JSON.parse(body),key,'feed'));
   if(!value||!Array.isArray(value.jobs)||!Array.isArray(value.agents)||!value.captured_at)throw new Error('Invalid snapshot');
   return value;
  };
  window.fleetLock=()=>{locked=true;delete window.fleetRefresh;delete window.fleetLock;location.reload();};
  document.open();document.write(html);document.close();
 }catch(e){button.disabled=false;error.textContent=globalThis.crypto?.subtle?'Could not unlock. Check the password and try again.':'Open this page over HTTPS in a modern browser.';document.getElementById('pw')?.focus();}
});
})();
</script></body></html>
