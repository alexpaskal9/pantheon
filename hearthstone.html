  await new Promise((resolve,reject)=>{
    const request=db.transaction(STORE_NAME,'readwrite').objectStore(STORE_NAME).put(key,'unlock-key');
    request.onsuccess=()=>resolve();
    request.onerror=()=>reject(request.error);
  });
  db.close();
  return key;
}
async function rememberPassword(password){
  const key=await deviceKey();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(password));
  localStorage.setItem(REMEMBER_KEY,JSON.stringify({iv:enc(iv),ct:enc(ct),expiresAt:Date.now()+REMEMBER_MS}));
}
function clearRememberedPassword(){
  try{localStorage.removeItem(REMEMBER_KEY);}catch(e){}
}
async function recalledPassword(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');}catch(e){saved=null;}
  if(!saved||!saved.iv||!saved.ct||!saved.expiresAt)return '';
  if(saved.expiresAt<=Date.now()){clearRememberedPassword();return '';}
  try{
    const key=await deviceKey(false);
    if(!key)throw new Error('Missing device key');
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(saved.iv)},key,dec(saved.ct));
    return new TextDecoder().decode(pt);
  }catch(e){clearRememberedPassword();return '';}
}
async function go(automatic=false){
  const err=document.getElementById('err');err.textContent='Decrypting…';
  const button=document.getElementById('unlock-button');button.disabled=true;
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:dec(B.salt),iterations:B.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(B.iv)},key,dec(B.ct));
    const html=new TextDecoder().decode(pt);
    if(!automatic&&document.getElementById('remember').checked){
      try{await rememberPassword(pw);}catch(e){}
    }
    const handoff="__HEARTHSTONE_UNLOCK__";
    if(handoff)window[handoff]=pw;
    document.open();document.write(html);document.close();
  }catch(e){
    button.disabled=false;
    if(automatic){
      clearRememberedPassword();
      document.getElementById('pw').value='';
      document.getElementById('remember').checked=false;
      err.textContent='Saved unlock expired. Enter the password again.';
      document.getElementById('pw').focus();
    }else err.textContent='Wrong password.';
  }
}
async function autoUnlock(){
  if(new URLSearchParams(location.search).has('forget'))clearRememberedPassword();
  const pw=await recalledPassword();
  if(!pw)return;
  document.getElementById('pw').value=pw;
  document.getElementById('remember').checked=true;
  document.getElementById('err').textContent='Unlocking trusted browser…';
  await go(true);
}
autoUnlock();
