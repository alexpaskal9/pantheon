*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 75% 12%,rgba(170,119,53,.17),transparent 24rem),#eee7da;color:#181b24;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.box{position:relative;background:#f7f2e8;border:1px solid #c9bdab;border-radius:24px;padding:34px 30px 28px;max-width:370px;width:100%;text-align:left;box-shadow:0 24px 70px rgba(38,28,23,.13);overflow:hidden}
.box:before{content:'';position:absolute;inset:0 0 auto;height:5px;background:#7b2638}
h1{font:normal 28px/1 Georgia,serif;margin-bottom:18px}.seal{display:grid;place-items:center;width:54px;height:54px;border:1px solid #7b2638;border-radius:50%;color:#7b2638}
p{color:#65616a;font-size:13px;line-height:1.5;margin-bottom:22px}p strong{display:block;color:#181b24;font:30px/1.05 Georgia,"Times New Roman",serif;margin-bottom:7px}
input{width:100%;background:#fffaf1;border:1px solid #c9bdab;border-radius:12px;color:#181b24;padding:13px 14px;font-size:16px;margin-bottom:12px;text-align:left;min-height:48px}
input:focus{outline:3px solid #7b2638;outline-offset:2px;border-color:#7b2638}
button{width:100%;background:#181b24;color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:750;cursor:pointer;min-height:48px}
button:hover{background:#571827}button:focus-visible{outline:3px solid #7b2638;outline-offset:3px}
.remember{display:flex;align-items:center;gap:10px;color:#65616a;font-size:12px;text-align:left;margin:1px 2px 16px;cursor:pointer;min-height:44px}
.remember input{width:18px;height:18px;min-height:18px;margin:0;accent-color:#7b2638}
.autofill-user{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.err{color:#7b2638;font-size:13px;min-height:20px;margin-top:11px}
@media(max-width:380px){body{padding:14px}.box{padding:29px 21px 22px;border-radius:19px}p strong{font-size:27px}}
</style></head><body>
<div class="box"><h1><span class="seal">A</span></h1><p><strong>Command Centre</strong><br>Use your existing Pantheon password.</p>
<form id="unlock-form" onsubmit="event.preventDefault();go()">
<input class="autofill-user" name="username" value="pantheon" autocomplete="username" tabindex="-1">
<input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password"
autocapitalize="none" spellcheck="false" autofocus>
<label class="remember"><input id="remember" type="checkbox" checked>Remember this browser for 30 days</label>
<button id="unlock-button" type="submit">Unlock</button>
</form>

const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const REMEMBER_KEY='pantheon.unlock.v1';
const REMEMBER_MS=30*24*60*60*1000;
const DB_NAME='pantheon-device-vault';
const STORE_NAME='keys';
function openDeviceVault(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>request.result.createObjectStore(STORE_NAME);
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function deviceKey(create=true){
  const db=await openDeviceVault();
  const current=await new Promise((resolve,reject)=>{
    const request=db.transaction(STORE_NAME).objectStore(STORE_NAME).get('unlock-key');
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
  if(current||!create){db.close();return current;}
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  await new Promise((resolve,reject)=>{
    const request=db.transaction(STORE_NAME,'readwrite').objectStore(STORE_NAME).put(key,'unlock-key');
    request.onsuccess=()=>resolve();
    request.onerror=()=>reject(request.error);
  });
  db.close();
  return key;
}
async function rememberPassword(password){
  const key=await deviceKey();
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(password));
  localStorage.setItem(REMEMBER_KEY,JSON.stringify({iv:enc(iv),ct:enc(ct),expiresAt:Date.now()+REMEMBER_MS}));
}
function clearRememberedPassword(){
  try{localStorage.removeItem(REMEMBER_KEY);}catch(e){}
}
async function recalledPassword(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(REMEMBER_KEY)||'null');}catch(e){saved=null;}
  if(!saved||!saved.iv||!saved.ct||!saved.expiresAt)return '';
  if(saved.expiresAt<=Date.now()){clearRememberedPassword();return '';}
  try{
    const key=await deviceKey(false);
    if(!key)throw new Error('Missing device key');
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(saved.iv)},key,dec(saved.ct));
    return new TextDecoder().decode(pt);
  }catch(e){clearRememberedPassword();return '';}
}
async function go(automatic=false){
  const err=document.getElementById('err');err.textContent='Decrypting…';
  const button=document.getElementById('unlock-button');button.disabled=true;
  try{
    const pw=document.getElementById('pw').value;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:dec(B.salt),iterations:B.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(B.iv)},key,dec(B.ct));
    const html=new TextDecoder().decode(pt);
    if(!automatic&&!document.getElementById('remember').checked)clearRememberedPassword();
    if(!automatic&&document.getElementById('remember').checked){
      try{await rememberPassword(pw);}catch(e){alert('Unlocked, but this browser could not remember the login.');}
    }
    const handoff="";
    if(handoff)window[handoff]=pw;
    document.open();document.write(html);document.close();
  }catch(e){
    button.disabled=false;
    if(automatic){
      clearRememberedPassword();
      document.getElementById('pw').value='';
      document.getElementById('remember').checked=false;
      err.textContent='Saved unlock expired. Enter the password again.';
      document.getElementById('pw').focus();
    }else err.textContent='Wrong password.';
  }
}
async function autoUnlock(){
  if(new URLSearchParams(location.search).has('forget'))clearRememberedPassword();
  const pw=await recalledPassword();
  if(!pw)return;
  document.getElementById('pw').value=pw;
  document.getElementById('remember').checked=true;
  document.getElementById('err').textContent='Unlocking trusted browser…';
  await go(true);
}
autoUnlock();
